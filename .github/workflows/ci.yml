name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The differential suite skips itself when duckdb is absent, which on a
      # bare runner means the strongest evidence this repository has never runs.
      # A skipped test is not a passing one.
      - name: Install DuckDB
        run: |
          curl -fsSL -o duckdb.zip https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d /usr/local/bin
          chmod +x /usr/local/bin/duckdb
          duckdb --version

      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...

      # A model that ships must pass the gate it asks everyone else to pass.
      - name: Gate the bundled models
        run: |
          go run ./cmd/semc lint -model testdata/shifts.yaml
          go run ./cmd/semc lint -model testdata/meridian.yaml
          go run ./cmd/semc import -dbt testdata/dbt/semantic_manifest.json
          go run ./cmd/semc import -ossie testdata/ossie/shifts_ossie.yaml
